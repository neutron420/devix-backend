name: Continuous Deployment

on:
  push:
    branches: [ main, production ]

env:
  REGISTRY: docker.io

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build check
        run: go build ./...

  build-and-deploy:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4

      - name: Set Env
        id: env_vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "image_name=devix" >> $GITHUB_OUTPUT
            echo "ops_path=prod/backend" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "image_name=devix-staging" >> $GITHUB_OUTPUT
            echo "ops_path=staging/backend" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.env_vars.outputs.image_name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.env_vars.outputs.image_name }}:latest

      - name: Update staging-ops
        env:
          PAT: ${{ secrets.STAGING_OPS_PAT }}
        run: |
          # 1. Clone the ops repository
          git clone https://x-access-token:${PAT}@github.com/${{ github.repository_owner }}/staging-ops.git
          cd staging-ops
          
          # 2. Identify target file
          FILE_PATH="${{ steps.env_vars.outputs.ops_path }}/deployment.yml"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.env_vars.outputs.image_name }}"
          NEW_TAG="${{ github.sha }}"
          
          if [ -f "$FILE_PATH" ]; then
            echo "Updating image in $FILE_PATH to $NEW_TAG"
            
            # Precise regex to only update the correct image line
            # Matches 'image: <IMAGE_NAME>:<TAG>' and replaces with 'image: <IMAGE_NAME>:<NEW_TAG>'
            sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${NEW_TAG}|g" "$FILE_PATH"
            
            # 3. Commit and Push if changed
            if [[ -n "$(git status --porcelain)" ]]; then
              git config user.name "Devix Ghost Bot"
              git config user.email "bot@devix.app"
              git add "$FILE_PATH"
              
              COMMIT_MSG="deploy(${{ steps.env_vars.outputs.env }}): update image to ${NEW_TAG:0:7}"
              COMMIT_BODY="Triggered by commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
              
              git commit -m "$COMMIT_MSG" -m "$COMMIT_BODY"
              git push origin main
              echo "Successfully updated staging-ops!"
            else
              echo "No changes needed. Image is already at current SHA."
            fi
          else
            echo "Error: $FILE_PATH not found in staging-ops repo!"
            exit 1
          fi
