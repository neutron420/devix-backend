openapi: 3.0.3
info:
  title: Devix Backend API
  version: 1.0.0
  description: HTTP API for auth, users, posts, comments, votes, notifications, organizations, chat, polls, reports, analytics, and activity.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Posts
  - name: Comments
  - name: Tags
  - name: Votes
  - name: Notifications
  - name: Bookmarks
  - name: Follow
  - name: Reports
  - name: Activity
  - name: Chat
  - name: Organizations
  - name: Polls
  - name: Analytics
paths:
  /:
    get:
      tags: [System]
      security: []
      summary: API welcome
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /health:
    get:
      tags: [System]
      security: []
      summary: Health check
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /metrics:
    get:
      tags: [System]
      security: []
      summary: Prometheus metrics, when enabled
      responses:
        "200":
          description: Prometheus text exposition
  /ws:
    get:
      tags: [System]
      summary: Authenticated websocket connection
      responses:
        "101":
          description: Switching protocols
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Register a new user
      requestBody: { $ref: "#/components/requestBodies/SignupRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate a user
      requestBody: { $ref: "#/components/requestBodies/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      requestBody: { $ref: "#/components/requestBodies/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke a refresh token
      requestBody: { $ref: "#/components/requestBodies/RefreshRequest" }
      responses:
        "204": { description: Logged out }
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      security: []
      summary: Verify email token
      requestBody: { $ref: "#/components/requestBodies/VerifyEmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Request password reset
      requestBody: { $ref: "#/components/requestBodies/ForgotPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Reset password with token
      requestBody: { $ref: "#/components/requestBodies/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [Users]
      summary: Update current user profile
      requestBody: { $ref: "#/components/requestBodies/UpdateProfileRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Users]
      summary: Delete current account
      responses:
        "204": { description: Account deleted }
  /api/v1/me/settings:
    patch:
      tags: [Users]
      summary: Update current user settings
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/me/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate current account
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/me/avatar:
    put:
      tags: [Users]
      summary: Upload current user avatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/users/{username}:
    get:
      tags: [Users]
      security: []
      summary: Get public user profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users/{username}/followers:
    get:
      tags: [Follow]
      security: []
      summary: List user followers
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/users/{username}/following:
    get:
      tags: [Follow]
      security: []
      summary: List users followed by a user
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/users/{username}/follow:
    post:
      tags: [Follow]
      summary: Follow a user
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204": { description: Followed }
    delete:
      tags: [Follow]
      summary: Unfollow a user
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204": { description: Unfollowed }
  /api/v1/posts:
    get:
      tags: [Posts]
      security: []
      summary: List published posts
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Tag"
      responses:
        "200": { $ref: "#/components/responses/OKWithMeta" }
    post:
      tags: [Posts]
      summary: Create a post
      requestBody: { $ref: "#/components/requestBodies/CreatePostRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/posts/{slug}:
    get:
      tags: [Posts]
      security: []
      summary: Get post by slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    put:
      tags: [Posts]
      summary: Update a post
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody: { $ref: "#/components/requestBodies/UpdatePostRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Posts]
      summary: Delete a post
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "204": { description: Deleted }
  /api/v1/posts/drafts:
    get:
      tags: [Posts]
      summary: List current user's drafts
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/posts/{slug}/autosave:
    patch:
      tags: [Posts]
      summary: Autosave a draft post
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody: { $ref: "#/components/requestBodies/AutosaveRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/posts/{slug}/media:
    post:
      tags: [Posts]
      summary: Upload media to a post
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/feed:
    get:
      tags: [Posts]
      security: []
      summary: Alias for post feed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Q"
      responses:
        "200": { $ref: "#/components/responses/OKWithMeta" }
  /api/v1/feed/following:
    get:
      tags: [Posts]
      summary: Following-only feed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OKWithMeta" }
  /api/v1/feed/explore:
    get:
      tags: [Posts]
      security: []
      summary: Explore feed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OKWithMeta" }
  /api/v1/search:
    get:
      tags: [Posts]
      security: []
      summary: Search posts
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/OKWithMeta" }
  /api/v1/posts/{id}/comments:
    get:
      tags: [Comments]
      security: []
      summary: List post comments
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    post:
      tags: [Comments]
      summary: Create post comment
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/CreateCommentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/comments/{id}:
    put:
      tags: [Comments]
      summary: Update comment
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/UpdateCommentRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Comments]
      summary: Delete comment
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Deleted }
  /api/v1/tags:
    get:
      tags: [Tags]
      security: []
      summary: List or search tags
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/tags/trending:
    get:
      tags: [Tags]
      security: []
      summary: List trending tags
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/tags/tree:
    get:
      tags: [Tags]
      security: []
      summary: List hierarchical tag tree
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/tags/category/{category}:
    get:
      tags: [Tags]
      security: []
      summary: List tags by category
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/posts/{id}/vote:
    post:
      tags: [Votes]
      summary: Vote on post
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/VoteRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Votes]
      summary: Remove post vote
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Vote removed }
  /api/v1/comments/{id}/vote:
    post:
      tags: [Votes]
      summary: Vote on comment
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/VoteRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Votes]
      summary: Remove comment vote
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Vote removed }
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications read
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/bookmarks:
    get:
      tags: [Bookmarks]
      summary: List bookmarks
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/posts/{id}/bookmark:
    post:
      tags: [Bookmarks]
      summary: Toggle post bookmark on
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Bookmarks]
      summary: Toggle post bookmark off
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List all reports
      responses:
        "200": { $ref: "#/components/responses/OK" }
    post:
      tags: [Reports]
      summary: Create report
      requestBody: { $ref: "#/components/requestBodies/CreateReportRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/reports/pending:
    get:
      tags: [Reports]
      summary: List pending reports
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/reports/{id}:
    patch:
      tags: [Reports]
      summary: Review report
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/activity:
    get:
      tags: [Activity]
      summary: List current user's activity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/chat/messages:
    post:
      tags: [Chat]
      summary: Send chat message
      requestBody: { $ref: "#/components/requestBodies/SendMessageRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/chat/conversations:
    get:
      tags: [Chat]
      summary: List conversations
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/chat/conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: List conversation messages
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/chat/conversations/{id}/read:
    patch:
      tags: [Chat]
      summary: Mark conversation messages read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/chat/typing/{id}:
    post:
      tags: [Chat]
      summary: Send typing indicator
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/organizations:
    get:
      tags: [Organizations]
      security: []
      summary: List organizations
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    post:
      tags: [Organizations]
      summary: Create organization
      requestBody: { $ref: "#/components/requestBodies/CreateOrgRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/organizations/slug/{slug}:
    get:
      tags: [Organizations]
      security: []
      summary: Get organization by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/organizations/{id}:
    get:
      tags: [Organizations]
      security: []
      summary: Get organization by ID
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    put:
      tags: [Organizations]
      summary: Update organization
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
    delete:
      tags: [Organizations]
      summary: Delete organization
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Deleted }
  /api/v1/organizations/{id}/members:
    get:
      tags: [Organizations]
      security: []
      summary: List organization members
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
    post:
      tags: [Organizations]
      summary: Add organization member
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "204": { description: Added }
  /api/v1/organizations/{id}/members/{user_id}:
    delete:
      tags: [Organizations]
      summary: Remove organization member
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed }
  /api/v1/polls:
    post:
      tags: [Polls]
      summary: Create poll
      requestBody: { $ref: "#/components/requestBodies/CreatePollRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
  /api/v1/polls/{id}/vote:
    post:
      tags: [Polls]
      summary: Vote in poll
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody: { $ref: "#/components/requestBodies/JSON" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/v1/analytics/posts/{id}:
    get:
      tags: [Analytics]
      summary: Get post analytics
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/OK" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    After:
      name: after
      in: query
      schema: { type: string }
    Before:
      name: before
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Tag:
      name: tag
      in: query
      schema: { type: string }
  requestBodies:
    JSON:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    SignupRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SignupRequest" }
    LoginRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LoginRequest" }
    RefreshRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RefreshRequest" }
    VerifyEmailRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
    ForgotPasswordRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
    ResetPasswordRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
    CreatePostRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreatePostRequest" }
    UpdatePostRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdatePostRequest" }
    AutosaveRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AutosaveRequest" }
    CreateCommentRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateCommentRequest" }
    UpdateCommentRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateCommentRequest" }
    VoteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoteRequest" }
    SendMessageRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SendMessageRequest" }
    CreateReportRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateReportRequest" }
    UpdateProfileRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
    CreateOrgRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateOrgRequest" }
    CreatePollRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreatePollRequest" }
  responses:
    OK:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    OKWithMeta:
      description: Successful response with pagination metadata
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    Created:
      description: Created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    # --- Core Response Wrappers ---
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"
    Meta:
      type: object
      properties:
        cursor: { type: string }
        prev_cursor: { type: string }
        has_more: { type: boolean }
        total: { type: integer, format: int64 }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    # --- Auth Request Schemas ---
    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 10, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }

    # --- Auth Response Schemas ---
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUserResponse" }
        tokens: { $ref: "#/components/schemas/TokenResponse" }
    AuthUserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        role: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }

    # --- User / Profile Schemas ---
    UpdateProfileRequest:
      type: object
      properties:
        display_name: { type: string, maxLength: 100 }
        bio: { type: string }
        website_url: { type: string, maxLength: 255 }
        github_url: { type: string, maxLength: 255 }
        twitter_url: { type: string, maxLength: 255 }
        location: { type: string, maxLength: 100 }
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        role: { type: string }
        is_active: { type: boolean }
        is_verified: { type: boolean }
        post_count: { type: integer }
        reputation: { type: integer }
        website_url: { type: string }
        github_url: { type: string }
        twitter_url: { type: string }
        location: { type: string }
        followers_count: { type: integer }
        following_count: { type: integer }
        created_at: { type: string, format: date-time }
    UserPublicProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }

    # --- Post Schemas ---
    CreatePostRequest:
      type: object
      required: [title, content, post_type]
      properties:
        title: { type: string, minLength: 5, maxLength: 300 }
        content: { type: string, minLength: 10 }
        post_type: { type: string, enum: [question, concept, build-log] }
        status: { type: string, enum: [draft, published], default: published }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 50 }
        external_links: { type: string }
    UpdatePostRequest:
      type: object
      properties:
        title: { type: string, minLength: 5, maxLength: 300 }
        content: { type: string, minLength: 10 }
        status: { type: string, enum: [draft, published, archived] }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 50 }
        external_links: { type: string }
    AutosaveRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        content: { type: string }
    PostResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserPublicProfile" }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        post_type: { type: string, enum: [question, concept, build-log] }
        status: { type: string, enum: [draft, published, archived] }
        view_count: { type: integer }
        vote_count: { type: integer }
        comment_count: { type: integer }
        is_pinned: { type: boolean }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        media:
          type: array
          items: { $ref: "#/components/schemas/MediaResponse" }
        external_links: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # --- Comment Schemas ---
    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        parent_id: { type: string, format: uuid }
    UpdateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserPublicProfile" }
        parent_id: { type: string, format: uuid, nullable: true }
        content: { type: string }
        depth: { type: integer }
        vote_count: { type: integer }
        is_deleted: { type: boolean }
        replies:
          type: array
          items: { $ref: "#/components/schemas/CommentResponse" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # --- Tag Schemas ---
    TagResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    # --- Media Schemas ---
    MediaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        file_url: { type: string }
        file_type: { type: string, enum: [image, video, document] }
        file_size: { type: integer, format: int64 }
        mime_type: { type: string }
        original_name: { type: string }

    # --- Vote Schemas ---
    VoteRequest:
      type: object
      required: [vote_type]
      properties:
        vote_type: { type: integer, enum: [1, -1], description: "1 for upvote, -1 for downvote" }

    # --- Notification Schemas ---
    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            avatar_url: { type: string, nullable: true }
        action: { type: string }
        target_id: { type: string, format: uuid }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/NotificationResponse" }
        unread_count: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        has_more: { type: boolean }

    # --- Chat Schemas ---
    SendMessageRequest:
      type: object
      required: [recipient_id, content]
      properties:
        recipient_id: { type: string, format: uuid }
        content: { type: string }
    ConversationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        other_user: { $ref: "#/components/schemas/UserPublicProfile" }
        last_message: { type: string }
        last_msg_at: { type: string, format: date-time }
        unread_count: { type: integer }
    MessageResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        content: { type: string }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }

    # --- Organization Schemas ---
    CreateOrgRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        bio: { type: string }
        website_url: { type: string, maxLength: 255 }
    OrgResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        bio: { type: string }
        avatar_url: { type: string }
        website_url: { type: string }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    # --- Poll Schemas ---
    CreatePollRequest:
      type: object
      required: [post_id, question, options]
      properties:
        post_id: { type: string, format: uuid }
        question: { type: string, maxLength: 255 }
        options:
          type: array
          minItems: 2
          items: { type: string, maxLength: 255 }
        expires_at: { type: string, format: date-time }
    PollVoteRequest:
      type: object
      required: [option_id]
      properties:
        option_id: { type: string, format: uuid }

    # --- Report Schemas ---
    CreateReportRequest:
      type: object
      required: [target_id, target_type, reason]
      properties:
        target_id: { type: string, format: uuid }
        target_type: { type: string, enum: [post, comment, user] }
        reason: { type: string }
        details: { type: string }

    # --- Activity Schemas ---
    ActivityResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    # --- Analytics Schemas ---
    PostAnalyticsResponse:
      type: object
      properties:
        total_views: { type: integer }
        unique_views: { type: integer }
        countries:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              count: { type: integer }
        devices:
          type: array
          items:
            type: object
            properties:
              device: { type: string }
              count: { type: integer }
        referrers:
          type: array
          items:
            type: object
            properties:
              referrer: { type: string }
              count: { type: integer }
